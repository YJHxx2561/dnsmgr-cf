# 通过 GitHub Actions 部署 dnsmgr 到 Cloudflare Workers
#
# 项目结构：Worker 项目位于仓库根目录（package.json / wrangler.toml / src / web / migrations 都在根）。
#
# 前置准备（在仓库 Settings → Secrets and variables → Actions 中配置）：
#   1) Secrets（必填）：
#      - CLOUDFLARE_API_TOKEN：Cloudflare API Token（权限：Account / Workers Scripts:Edit、D1:Edit、Workers KV Storage:Edit）
#      - CLOUDFLARE_ACCOUNT_ID：Cloudflare 账户 ID
#   2) Variables（可选）：CF_D1_DATABASE_ID / CF_KV_NAMESPACE_ID（资源已存在时填，加速部署）
#
# 自动建资源：若未提供 Variables，工作流会自动创建 D1/KV（如不存在）并注入 ID，
# 因此首次使用只需配置两个 Secret，push 即可完成全部部署，无需手动建库、无需新建仓库。

name: Deploy dnsmgr to Cloudflare

on:
  # 推送到 main 分支自动部署
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'web/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - 'tsconfig.json'
      - '.github/workflows/deploy-cloudflare.yml'
  # 手动触发
  workflow_dispatch:

# 同一分支并发的部署只保留最新一次，避免相互覆盖
concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci

      - name: 准备 D1 / KV 资源并注入 ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
        run: |
          set -e
          D1_ID="$CF_D1_DATABASE_ID"
          KV_ID="$CF_KV_NAMESPACE_ID"

          # D1：优先用 Variable；否则复用同名库，再否则创建
          if [ -z "$D1_ID" ]; then
            D1_ID=$(npx wrangler d1 list --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=JSON.parse(s);const x=a.find(o=>o.name==='dnsmgr');if(x)process.stdout.write(x.uuid||x.id||'')}catch(e){}})")
          fi
          if [ -z "$D1_ID" ]; then
            echo "未找到 D1 数据库，正在自动创建 dnsmgr ..."
            CREATE_OUT=$(npx wrangler d1 create dnsmgr 2>&1 || true)
            echo "$CREATE_OUT"
            D1_ID=$(printf '%s' "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || true)
          fi
          if [ -z "$D1_ID" ]; then echo "::error::无法获取 D1 数据库 ID，请检查 API Token 的 D1:Edit 权限"; exit 1; fi

          # KV：优先用 Variable；否则复用同名命名空间，再否则创建
          if [ -z "$KV_ID" ]; then
            KV_ID=$(npx wrangler kv namespace list --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=JSON.parse(s);const x=a.find(o=>o.title==='dnsmgr_kv');if(x)process.stdout.write(x.id||'')}catch(e){}})")
          fi
          if [ -z "$KV_ID" ]; then
            echo "未找到 KV 命名空间，正在自动创建 dnsmgr_kv ..."
            CREATE_KV=$(npx wrangler kv namespace create dnsmgr_kv 2>&1 || true)
            echo "$CREATE_KV"
            KV_ID=$(printf '%s' "$CREATE_KV" | grep -oE '[0-9a-f]{32}' | head -1 || true)
          fi
          if [ -z "$KV_ID" ]; then echo "::error::无法获取 KV 命名空间 ID，请检查 API Token 的 Workers KV Storage:Edit 权限"; exit 1; fi

          echo "D1_ID=$D1_ID"
          echo "KV_ID=$KV_ID"
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$D1_ID/g" wrangler.toml
          sed -i "s/REPLACE_WITH_YOUR_KV_NAMESPACE_ID/$KV_ID/g" wrangler.toml
          echo "wrangler.toml 资源配置："
          grep -E 'database_id|^id =' wrangler.toml || true

      - name: 应用 D1 数据库迁移（幂等，不删除数据）
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      - name: 部署 Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
