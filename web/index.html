<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>彩虹聚合DNS管理系统</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- ============ 登录页 ============ -->
<div id="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo">🌈</div>
      <h1>彩虹聚合DNS管理</h1>
      <p>Cloudflare Workers Edition</p>
    </div>
    <form id="login-form">
      <div class="field">
        <label>用户名</label>
        <input class="input" type="text" id="login-username" placeholder="请输入用户名" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input class="input" type="password" id="login-password" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <div class="field" id="vcode-group">
        <label>验证码</label>
        <div class="input-group">
          <input class="input" type="text" id="login-code" placeholder="请输入计算结果" autocomplete="off">
          <img class="captcha-img" id="vcode-img" src="/verifycode" alt="验证码" title="点击刷新">
        </div>
      </div>
      <div class="field" id="totp-group" style="display:none">
        <label>动态口令 (TOTP)</label>
        <input class="input" type="text" id="totp-code" placeholder="请输入6位动态口令" autocomplete="one-time-code">
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="login-btn">登 录</button>
      <div class="msg" id="login-msg"></div>
    </form>
  </div>
</div>

<!-- ============ 主应用 ============ -->
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <div class="logo">🌈</div>
      <div><b>彩虹DNS</b><small>Cloudflare Edition</small></div>
    </div>
    <nav id="sidebar-menu"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menu-toggle">☰</button>
      <div class="crumb">控制台 / <b id="crumb-title">仪表盘</b></div>
      <div class="topbar-right">
        <div class="user-chip"><div class="avatar" id="user-avatar">U</div><span id="user-name">用户</span></div>
        <button class="btn btn-ghost btn-sm" id="logout-btn" title="退出登录">退出</button>
      </div>
    </header>
    <main class="content">
      <h2 class="page-title" id="page-title">仪表盘</h2>
      <div id="main-content"><div class="loader">加载中...</div></div>
    </main>
  </div>
</div>

<!-- ============ 模态框 ============ -->
<div id="modal-mask">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-title">编辑</h3><button class="modal-close" id="modal-close">&times;</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">保存</button>
    </div>
  </div>
</div>

<!-- ============ Toast 提示 ============ -->
<div id="toast-box"></div>

<script src="/app.js"></script>
</body>
</html>
